apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-app
  labels:
    app: college-event
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-event
  template:
    metadata:
      labels:
        app: college-event
    spec:
      containers:
      - name: event-portal
        image: your-dockerhub-username/college-event-app:latest  # Replace with your Docker Hub handle
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-service
spec:
  type: NodePort
  selector:
    app: college-event
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080  # Accessible via http://<Node-IP>:30080
